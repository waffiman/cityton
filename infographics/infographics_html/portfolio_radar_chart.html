<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Produktportfolio Radar</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { margin: 0; padding: 2rem; background: #fafafa; font-family: sans-serif; }
  #root { max-width: 800px; margin: 0 auto; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {
  Radar, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis,
  ResponsiveContainer, Legend, Tooltip
} = Recharts;

const portfolioData = [
  { metric: 'TSER (%)', 'Serie R': 80, 'ARM Platinum': 60, 'UV Protection Clear': 20, fullMark: 100 },
  { metric: 'VLT (%)', 'Serie R': 15, 'ARM Platinum': 80, 'UV Protection Clear': 89, fullMark: 100 },
  { metric: 'UV-Schutz (%)', 'Serie R': 99, 'ARM Platinum': 99, 'UV Protection Clear': 99.9, fullMark: 100 }
];

function PortfolioRadarChart() {
  return (
    <div style={{ width: '100%', height: 400 }}>
      <ResponsiveContainer width="100%" height="100%">
        <RadarChart cx="50%" cy="50%" outerRadius="80%" data={portfolioData}>
          <PolarGrid />
          <PolarAngleAxis dataKey="metric" />
          <PolarRadiusAxis angle={90} domain={[0, 100]} />
          <Tooltip />
          <Legend />
          <Radar name="Serie R" dataKey="Serie R" stroke="#8884d8" fill="#8884d8" fillOpacity={0.6} />
          <Radar name="ARM Platinum" dataKey="ARM Platinum" stroke="#82ca9d" fill="#82ca9d" fillOpacity={0.6} />
          <Radar name="UV Protection Clear" dataKey="UV Protection Clear" stroke="#ffc658" fill="#ffc658" fillOpacity={0.6} />
        </RadarChart>
      </ResponsiveContainer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PortfolioRadarChart />);
</script>
</body>
</html>
