<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Temperaturvergleich</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { margin: 0; padding: 2rem; background: #fafafa; font-family: sans-serif; }
  #root { max-width: 800px; margin: 0 auto; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {
  BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer
} = Recharts;

const temperatureData = [
  { name: 'Ohne Schutzfolie', temperatur: 33.3, fill: '#ff4d4f' },
  { name: 'Mit Schutzfolie', temperatur: 25.7, fill: '#73d13d' }
];

function TemperatureComparisonChart() {
  return (
    <div style={{ width: '100%', height: 400 }}>
      <ResponsiveContainer width="100%" height="100%">
        <BarChart data={temperatureData} margin={{ top: 20, right: 30, left: 20, bottom: 5 }}>
          <CartesianGrid strokeDasharray="3 3" />
          <XAxis dataKey="name" />
          <YAxis unit="°C" />
          <Tooltip cursor={{ fill: 'transparent' }} />
          <Legend />
          <Bar
            dataKey="temperatur"
            name="Oberflächentemperatur (°C)"
            barSize={60}
            radius={[4, 4, 0, 0]}
          />
        </BarChart>
      </ResponsiveContainer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<TemperatureComparisonChart />);
</script>
</body>
</html>
